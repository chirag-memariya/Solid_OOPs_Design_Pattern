apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-service
spec:
  selector:
    matchLabels:
      run: fd-service
  template:
    metadata:
      labels:
        run: fd-service
    spec:
      containers:
      - name: fd-service
        image: memariyachirag126/fd-service:rtsp-new
        env:
          - name: RTSP_STREAM_URL
            value: rtsp://rtspstream:f4861e4f91bd71ea5667d4f3011735e2@zephyr.rtsp.stream/movie
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m
          requests:
            cpu: 200m
      # restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: fd-service
  labels:
    run: fd-service
spec:
  selector:
    run: fd-service
  type: NodePort
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 32001

